[meta]
  title = "Flask Live Text-to-Speech Starter"
  description = "Get started using Deepgram's Live Text-to-Speech with this Flask demo app"
  author = "Deepgram DX Team <devrel@deepgram.com> (https://developers.deepgram.com)"
  repository = "https://github.com/deepgram-starters/flask-live-text-to-speech"
  useCase = "TTS"
  language = "Python"
  framework = "Flask"

[pre-build]
  command = "make init"
  message = "Dependencies installed (Python + frontend)"

[build]
  command = "make build"
  message = "Build completed"

[build.config]
  sample = "sample.env"
  output = ".env"

[post-build]
  message = "Run `make start` to get up and running."
